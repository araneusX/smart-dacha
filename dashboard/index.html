<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smart-dch — температура</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #8884;
      }
      input,
      button {
        font: inherit;
        padding: 0.4rem 0.6rem;
      }
      .muted {
        opacity: 0.7;
      }
      .err {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>Температура</h1>
    <form id="login">
      <p>Введите пароль, чтобы расшифровать адрес API.</p>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">Войти</button>
      <p id="loginError" class="err" hidden>Неверный пароль</p>
    </form>
    <section id="panel" hidden>
      <p id="status" class="muted">Нет данных</p>
      <table>
        <thead>
          <tr>
            <th>id</th>
            <th>t, °C</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <script src="crypto.js"></script>
    <script src="config.js"></script>
    <script>
      let apiUrl = "";
      let jsonpSeq = 0;

      function fetchJsonp(url) {
        return new Promise((resolve, reject) => {
          const cb = "sdcb" + ++jsonpSeq;
          const timer = setTimeout(() => {
            clearJsonpRequest();
            reject(new Error("timeout"));
          }, 15000);
          function clearJsonpRequest() {
            clearTimeout(timer);
            delete window[cb];
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }
          }
          window[cb] = (data) => {
            clearJsonpRequest();
            resolve(data);
          };
          const script = document.createElement("script");
          script.onerror = () => {
            clearJsonpRequest();
            reject(new Error("network"));
          };
          const join = url.indexOf("?") >= 0 ? "&" : "?";
          script.src = url + join + "callback=" + cb;
          document.body.appendChild(script);
        });
      }

      function renderLiveTable(data) {
        const rows = document.getElementById("rows");
        rows.innerHTML = "";
        const sensors = (data && data.sensors) || [];
        if (!sensors.length) {
          document.getElementById("status").textContent = "Нет live-снимка";
          return;
        }
        document.getElementById("status").textContent =
          "Обновлено " + new Date().toLocaleTimeString("ru-RU");
        for (const s of sensors) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td>" + s.id + "</td><td>" + Number(s.t).toFixed(1) + "</td>";
          rows.appendChild(tr);
        }
      }

      async function sendHeartbeat() {
        await fetchJsonp(apiUrl + "?type=3");
      }

      async function pollLiveSnapshot() {
        const data = await fetchJsonp(apiUrl + "?type=2");
        renderLiveTable(data);
      }

      document.getElementById("login").onsubmit = async (ev) => {
        ev.preventDefault();
        const err = document.getElementById("loginError");
        err.hidden = true;
        try {
          const token = window.DASHBOARD_CIPHER;
          if (!token || token.indexOf("PASTE_") === 0) {
            throw new Error("no cipher");
          }
          apiUrl = (await decryptUrl(token, document.getElementById("password").value)).trim();
          if (!/^https:\/\//i.test(apiUrl)) {
            throw new Error("bad url");
          }
          await sendHeartbeat();
          document.getElementById("login").hidden = true;
          document.getElementById("panel").hidden = false;
          await pollLiveSnapshot();
          setInterval(sendHeartbeat, 25000);
          setInterval(pollLiveSnapshot, 3000);
        } catch (e) {
          err.hidden = false;
        }
      };
    </script>
  </body>
</html>
